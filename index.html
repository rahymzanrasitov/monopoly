<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор / Рулетка</title>
  <style>
    :root {
      --bg-color: #f5f5f5;
      --panel-bg: #e6e6e6;
      --card-bg: #d9d9d9;
      --accent-active: #b3b3b3;
      --text-color: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Навигационная панель сверху */
    .top-nav-container {
      padding: 20px 10px 10px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .nav-bar {
      background-color: var(--panel-bg);
      border-radius: 40px;
      padding: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    .nav-btn.active {
      background-color: var(--accent-active);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    /* Иконки навигации */
    .dice-icon-mini {
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 4px;
      border: 1px solid #777;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dice-icon-mini::after {
      content: '';
      width: 5px;
      height: 5px;
      background: black;
      border-radius: 50%;
    }

    .smile-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid #000;
      position: relative;
    }
    .smile-icon::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 5px;
      width: 3px;
      height: 3px;
      background: #000;
      border-radius: 50%;
      box-shadow: 10px 0 0 #000;
    }
    .smile-icon::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 4px;
      width: 13px;
      height: 6px;
      border-bottom: 2.5px solid #000;
      border-radius: 0 0 10px 10px;
    }

    .arrow-icon-90 {
      transform: rotate(90deg);
      font-weight: 900;
      font-size: 20px;
      display: inline-block;
      line-height: 1;
    }

    .dots-icon {
      display: flex;
      gap: 3px;
    }
    .dots-icon span {
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
    }

    /* Область экранов */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    /* ЭКРАН 1: КУБИКИ */
    .dice-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .dice-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
      cursor: pointer;
    }

    .dice {
      width: 130px;
      height: 130px;
      background-color: var(--card-bg);
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.15s ease;
    }

    .dice:active {
      transform: scale(0.98);
    }

    .dot {
      width: 16px;
      height: 16px;
      background-color: #000;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      visibility: hidden;
    }

    .dot.visible {
      visibility: visible;
    }

    @keyframes rollAnimation {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(10deg) scale(1.05); }
      50% { transform: rotate(-10deg) scale(0.95); }
      75% { transform: rotate(5deg) scale(1.02); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .rolling {
      animation: rollAnimation 0.4s ease-in-out;
    }

    /* ЭКРАН 2: РУЛЕТКА ЦИФР (777) */
    .slots-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      width: 100%;
    }

    /* Блок кнопки прямой */
    .spin-btn-box {
      width: 75px;
      height: 220px;
      background-color: var(--card-bg);
      border: none;
      border-radius: 4px;
      font-size: 20px;
      font-weight: 500;
      color: #111;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      letter-spacing: 1px;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .spin-btn-box:active {
      background-color: var(--accent-active);
    }

    .spin-btn-box:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Текст повернут на 90 градусов */
    .btn-text-90 {
      transform: rotate(90deg);
      display: inline-block;
      white-space: nowrap;
    }

    .slots-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .slot-box {
      width: 140px;
      height: 70px;
      background-color: var(--card-bg);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: 600;
      color: #111;
      overflow: hidden;
    }

    .rotated-digit {
      transform: rotate(90deg);
      display: inline-block;
    }

    /* ЭКРАНЫ РУЛЕТОК С ТЕКСТОМ */
    .char-roulette-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .char-screen-box {
      width: 260px;
      height: 150px;
      background-color: var(--card-bg);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 12px;
    }

    .char-name-text {
      font-size: 26px;
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      transition: transform 0.1s;
      word-break: break-word;
    }

    .char-spin-btn-horiz {
      min-width: 150px;
      padding: 0 15px;
      height: 55px;
      background-color: var(--card-bg);
      border: none;
      border-radius: 4px;
      font-size: 20px;
      font-weight: 500;
      color: #111;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .char-spin-btn-horiz:active {
      background-color: var(--accent-active);
    }

    .char-spin-btn-horiz:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Оверлей настроек */
    .settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .settings-card {
      width: 80%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .settings-card h3 {
      font-size: 18px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .close-btn {
      padding: 8px;
      background: var(--card-bg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Навигация -->
    <div class="top-nav-container">
      <div class="nav-bar">
        <button class="nav-btn active" id="btn-dice" onclick="switchScreen('dice')">
          <div class="dice-icon-mini"></div>
        </button>
        <button class="nav-btn" id="btn-777" onclick="switchScreen('777')">777</button>
        <button class="nav-btn" id="btn-chars" onclick="switchScreen('chars')">
          <div class="smile-icon"></div>
        </button>
        <button class="nav-btn" id="btn-weapon" onclick="switchScreen('weapon')">
          <span class="arrow-icon-90">-&gt;</span>
        </button>
        <button class="nav-btn" id="btn-settings" onclick="openSettings()">
          <div class="dots-icon">
            <span></span><span></span><span></span>
          </div>
        </button>
      </div>
    </div>

    <!-- Область контента -->
    <div class="content-area">
      
      <!-- Экран 1: Кубики (без таймера) -->
      <div class="screen active" id="screen-dice">
        <div class="dice-wrapper">
          <div class="dice-container" onclick="rollDice()">
            <div class="dice" id="dice1"></div>
            <div class="dice" id="dice2"></div>
          </div>
        </div>
      </div>

      <!-- Экран 2: Рулетка 777 (Текст повернут на 90°) -->
      <div class="screen" id="screen-777">
        <div class="slots-container">
          <button class="spin-btn-box" id="btn-spin-777" onclick="spin777()">
            <span class="btn-text-90" id="btn-text-777">крутить</span>
          </button>
          <div class="slots-column">
            <div class="slot-box"><span class="rotated-digit" id="slot1">3</span></div>
            <div class="slot-box"><span class="rotated-digit" id="slot2">1</span></div>
            <div class="slot-box"><span class="rotated-digit" id="slot3">7</span></div>
          </div>
        </div>
      </div>

      <!-- Экран 3: Рулетка Персонажей -->
      <div class="screen" id="screen-chars">
        <div class="char-roulette-layout">
          <div class="char-screen-box">
            <div class="char-name-text" id="char-name">САТОРУ</div>
          </div>
          <button class="char-spin-btn-horiz" id="btn-spin-chars" onclick="spinCharacters()">крутить</button>
        </div>
      </div>

      <!-- Экран 4: Рулетка Оружия -->
      <div class="screen" id="screen-weapon">
        <div class="char-roulette-layout">
          <div class="char-screen-box">
            <div class="char-name-text" id="weapon-name">ПАЛЕЦ СУКУНЫ</div>
          </div>
          <button class="char-spin-btn-horiz" id="btn-spin-weapons" onclick="spinWeapons()">крутить</button>
        </div>
      </div>

    </div>

    <!-- Настройки -->
    <div class="settings-modal" id="settings-modal">
      <div class="settings-card">
        <h3>Настройки</h3>
        <p>Кулдаун между вращениями: 2 секунды</p>
        <button class="close-btn" onclick="closeSettings()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    const characters = [
      "Сатору", "Сукуна", "Маки", "Тодзи", "Юта", "Кашимо", "Юджи", 
      "Кендзяку", "Юки", "Хакари", "Дзёго", "Махорага", "Махито", 
      "Урауме", "Рю", "Сугуру", "Наоя", "Ханами", "Дагон", "Мигель", "Аой"
    ];

    const weapons = [
      "картины смерти",
      "освободитель",
      "палец сукуны",
      "Перевёрнутое копьё небес",
      "Игривое облако",
      "Меч Гомы",
      "Острая коса"
    ];

    let isSpinning = false;

    const cooldowns = {
      dice: 0,
      '777': 0,
      chars: 0,
      weapons: 0
    };

    // Установлена задержка в 2 секунды
    function startCooldown(type, btnElement, textElement = null) {
      cooldowns[type] = 2;
      if (btnElement) btnElement.disabled = true;

      const targetTextEl = textElement || btnElement;
      const originalText = targetTextEl ? targetTextEl.innerText : '';

      const timerInterval = setInterval(() => {
        cooldowns[type]--;

        if (targetTextEl) {
          targetTextEl.innerText = `${cooldowns[type]}c`;
        }

        if (cooldowns[type] <= 0) {
          clearInterval(timerInterval);
          if (btnElement) btnElement.disabled = false;
          if (targetTextEl) targetTextEl.innerText = originalText;
        }
      }, 1000);
    }

    function switchScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (screenName === 'dice') {
        document.getElementById('screen-dice').classList.add('active');
        document.getElementById('btn-dice').classList.add('active');
      } else if (screenName === '777') {
        document.getElementById('screen-777').classList.add('active');
        document.getElementById('btn-777').classList.add('active');
      } else if (screenName === 'chars') {
        document.getElementById('screen-chars').classList.add('active');
        document.getElementById('btn-chars').classList.add('active');
      } else if (screenName === 'weapon') {
        document.getElementById('screen-weapon').classList.add('active');
        document.getElementById('btn-weapon').classList.add('active');
      }
    }

    function renderDiceDots(diceEl, value) {
      diceEl.innerHTML = '';
      const dotPositions = {
        1: [4],
        2: [0, 8],
        3: [0, 4, 8],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
      };

      const activeDots = dotPositions[value] || [];
      for (let i = 0; i < 9; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (activeDots.includes(i)) {
          dot.classList.add('visible');
        }
        diceEl.appendChild(dot);
      }
    }

    function rollDice() {
      if (isSpinning || cooldowns.dice > 0) return;
      isSpinning = true;

      const d1 = document.getElementById('dice1');
      const d2 = document.getElementById('dice2');

      d1.classList.add('rolling');
      d2.classList.add('rolling');

      let rolls = 0;
      const interval = setInterval(() => {
        renderDiceDots(d1, Math.floor(Math.random() * 6) + 1);
        renderDiceDots(d2, Math.floor(Math.random() * 6) + 1);
        rolls++;

        if (rolls >= 6) {
          clearInterval(interval);
          d1.classList.remove('rolling');
          d2.classList.remove('rolling');
          isSpinning = false;
          startCooldown('dice', null, null);
        }
      }, 50);
    }

    function spin777() {
      if (isSpinning || cooldowns['777'] > 0) return;
      isSpinning = true;

      const btn = document.getElementById('btn-spin-777');
      const btnText = document.getElementById('btn-text-777');
      const slots = [
        document.getElementById('slot1'),
        document.getElementById('slot2'),
        document.getElementById('slot3')
      ];

      let rolls = 0;
      const interval = setInterval(() => {
        slots.forEach(slot => {
          slot.innerText = Math.floor(Math.random() * 7) + 1;
        });
        rolls++;

        if (rolls > 12) {
          clearInterval(interval);
          isSpinning = false;
          startCooldown('777', btn, btnText);
        }
      }, 60);
    }

    function spinCharacters() {
      if (isSpinning || cooldowns.chars > 0) return;
      isSpinning = true;

      const btn = document.getElementById('btn-spin-chars');
      const charText = document.getElementById('char-name');
      let rolls = 0;
      const totalRolls = 20;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * characters.length);
        charText.innerText = characters[randomIndex];
        charText.style.transform = `scale(${0.9 + Math.random() * 0.2})`;

        rolls++;
        if (rolls >= totalRolls) {
          clearInterval(interval);
          charText.style.transform = 'scale(1)';
          isSpinning = false;
          startCooldown('chars', btn);
        }
      }, 70);
    }

    function spinWeapons() {
      if (isSpinning || cooldowns.weapons > 0) return;
      isSpinning = true;

      const btn = document.getElementById('btn-spin-weapons');
      const wpnText = document.getElementById('weapon-name');
      let rolls = 0;
      const totalRolls = 20;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * weapons.length);
        wpnText.innerText = weapons[randomIndex];
        wpnText.style.transform = `scale(${0.9 + Math.random() * 0.2})`;

        rolls++;
        if (rolls >= totalRolls) {
          clearInterval(interval);
          wpnText.style.transform = 'scale(1)';
          isSpinning = false;
          startCooldown('weapons', btn);
        }
      }, 70);
    }

    function openSettings() {
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    renderDiceDots(document.getElementById('dice1'), 3);
    renderDiceDots(document.getElementById('dice2'), 1);
  </script>
</body>
</html>
